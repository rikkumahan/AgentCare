services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agentcare
      POSTGRES_PASSWORD: agentcare
      POSTGRES_DB: agentcare
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
